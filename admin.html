<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Staff area — Osca Complement Services</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{--navy:#0b1226;--navy2:#15203f;--gold:#c99a1f;--gold2:#e0b13a;--bg:#f6f2e9;--card:#fff;--line:#e6dfcf;--ink:#171a24;--mut:#6b6757;--ok:#13793a;--bad:#b3261e}
*{box-sizing:border-box}html,body{margin:0}body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--navy);color:#fff;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
header b{font-size:15px;white-space:nowrap}header .btn,header button{font-size:13px;padding:7px 11px!important;white-space:nowrap}header{gap:8px;min-width:0}header b{overflow:hidden;text-overflow:ellipsis}@media(max-width:600px){#who{display:none}header b em{display:none}}header b span{color:var(--gold2)}header .sp{flex:1}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1405;text-decoration:none;display:inline-block}
button.ghost,.btn.ghost{background:transparent;color:inherit;border:1px solid rgba(128,128,128,.45)}header button.ghost{color:#fff;border-color:rgba(255,255,255,.4);padding:7px 12px}
button.danger{background:var(--bad);color:#fff}button:disabled{opacity:.5;cursor:default}
main{max-width:980px;margin:0 auto;padding:16px 16px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.login{max-width:400px;margin:8vh auto 0}.login h1{margin:0 0 4px;font-size:22px}.login p{color:var(--mut);margin:0 0 14px}
label{display:block;font-weight:600;font-size:13px;margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}textarea{min-height:90px;resize:vertical}
nav.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 0;max-width:980px;margin:0 auto;scrollbar-width:none}
nav.tabs button{background:#fff;color:var(--ink);border:1px solid var(--line);white-space:nowrap;padding:9px 14px}nav.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.badge{background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;margin-left:6px}
.msg{padding:10px 12px;border-radius:10px;margin:10px 0;font-size:14px}.msg.err{background:#fde8e6;color:var(--bad)}.msg.ok{background:#e4f5ea;color:var(--ok)}.msg.info{background:#fff6dc;color:#6a5208}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:0 0 auto}.grow{flex:1 1 160px!important}
.req{border-left:4px solid var(--gold)}.req.done{border-left-color:#b8b3a2;opacity:.75}.req h3{margin:0 0 2px;font-size:16px}.req .meta{color:var(--mut);font-size:13px}.req pre{white-space:pre-wrap;word-break:break-word;font:inherit;background:#faf7ef;border-radius:8px;padding:10px;margin:8px 0}
.tag{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;background:var(--navy2);color:#fff;border-radius:6px;padding:2px 7px;margin-right:6px}
.prod{display:grid;grid-template-columns:1fr;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}.prod:last-child{border:0}.prod .n{font-weight:600}.prod .c{color:var(--mut);font-size:12px}.prod .f{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:6px}.prod.chg{background:#fff9e6;margin:0 -8px;padding:10px 8px;border-radius:8px}
.ph{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.ph img,.ph .nop{width:84px;height:64px;object-fit:cover;border-radius:8px;background:#ece6d6;flex:none;display:grid;place-items:center;font-size:11px;color:var(--mut);text-align:center}
.save{position:sticky;bottom:10px;z-index:10;display:flex;justify-content:flex-end}.save button{box-shadow:0 8px 24px rgba(0,0,0,.25)}
h2{margin:6px 0 10px;font-size:19px}small,.mut{color:var(--mut)}.hide{display:none!important}
@media(min-width:700px){.prod{grid-template-columns:1.6fr 2fr;align-items:center}}
</style>
</head>
<body>
<header><b>Osca <span>Complement</span><em style="font-style:normal"> · Staff</em></b><span class="sp"></span><a class="btn ghost hide" id="siteLink" href="index.html" style="padding:7px 12px">View site</a><button class="ghost hide" id="outBtn">Sign out</button></header>

<main id="loginView" class="hide">
  <div class="card login">
    <h1>Staff login</h1><p>For authorised staff only.</p>
    <form id="loginForm"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>
      <div id="loginMsg"></div>
      <div class="row" style="margin-top:14px"><button type="submit" id="loginBtn">Sign in</button></div>
    </form>
  </div>
</main>

<main id="setupView" class="hide"><div class="card"><h2>Admin area is not connected yet</h2><p>This page needs the Cloudflare backend. Open <b>CLOUDFLARE-SETUP.md</b> (in the website files) and follow the steps, including the database connection and the admin password.</p></div></main>

<div id="app" class="hide">
  <nav class="tabs" id="tabs"></nav>
  <main id="panel"></main>
</div>
<script type="module" src="admin.js?v=20261025"></script>
</body>
</html>
